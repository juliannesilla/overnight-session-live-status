const ITER = 200000;
async function decrypt(pw){
  const blob = Uint8Array.from(atob(PAYLOAD), c => c.charCodeAt(0));
  const salt = blob.slice(0, 16);
  const iv   = blob.slice(16, 28);
  const ct   = blob.slice(28);
  const baseKey = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pw), {name:"PBKDF2"}, false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:ITER, hash:"SHA-256"},
    baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return new TextDecoder().decode(pt);
}
async function unlock(){
  const pw = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "";
  try {
    const html = await decrypt(pw);
    sessionStorage.setItem("ov_pw", pw);
    document.open(); document.write(html); document.close();
  } catch(e) { err.textContent = "Wrong password."; }
}
document.getElementById("go").onclick = unlock;
document.getElementById("pw").addEventListener("keydown",
  e => { if (e.key === "Enter") unlock(); });
const cached = sessionStorage.getItem("ov_pw");
if (cached) {
  decrypt(cached).then(html => {
    document.open(); document.write(html); document.close();
  }).catch(() => { sessionStorage.removeItem("ov_pw"); });
}
